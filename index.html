<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
body{
margin:0;
font-family:Georgia;
background:linear-gradient(135deg,#ff4d6d,#ff758c);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
width:420px;
z-index:2;
}

h1{color:#ff2e63;}

button{
background:#ff2e63;
color:white;
border:none;
padding:10px 18px;
margin:6px;
border-radius:10px;
cursor:pointer;
}

#poem{
margin-top:20px;
font-size:20px;
font-style:italic;
min-height:120px;
}

img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin:5px;
}

.heart{
position:absolute;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-100px);}
100%{transform:translateY(100vh);}
}
</style>
</head>

<body>

<div class="container" id="capture">

<h1>❤️ Makaya Makosso Mary Laure exaucée❤️</h1>

<h3 id="timer"></h3>

<input type="file" id="photoUpload" multiple>
<br>

<div id="photos"></div>

<button onclick="generateLove()">Generate Love Message</button>


<div id="poem"></div>

</div>

<script>
const name="Makaya Makosso Mary Laure";

/* LOVE TIMER — set your date here */
const loveDate=new Date("2025-11-26");

function updateTimer(){
  const now=new Date();
  const diff=now-loveDate;
  const days=Math.floor(diff/(1000*60*60*24));
  document.getElementById("timer").innerText=
  "❤️ Together for "+days+" days ❤️";
}
setInterval(updateTimer,1000);

/* PHOTO UPLOAD WITH PERSISTENCE */
const photoContainer = document.getElementById("photos");
const photoUpload = document.getElementById("photoUpload");

// Load saved photos on page load
window.onload = function() {
  updateTimer();
  const savedPhotos = JSON.parse(localStorage.getItem("lovePhotos") || "[]");
  savedPhotos.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    photoContainer.appendChild(img);
  });
}

// Upload new photos
photoUpload.addEventListener("change", function(e){
  const files = Array.from(e.target.files);
  const savedPhotos = JSON.parse(localStorage.getItem("lovePhotos") || "[]");

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(event){
      const img = document.createElement("img");
      img.src = event.target.result;
      photoContainer.appendChild(img);

      // Save to localStorage
      savedPhotos.push(event.target.result);
      localStorage.setItem("lovePhotos", JSON.stringify(savedPhotos));
    }
    reader.readAsDataURL(file);
  });
});

/* POEMS */
const poems=[
`My dearest ${name} ❤️`

`If one day my heart stopped beating,
it would only be because it got tired
of whispering your name every second.`

`You came into my life so quietly,
but you changed everything so loudly.
Before you, days were just days…
now every sunrise feels like a promise
that I still have another moment to love you.`

`You are not just the woman I love —
you are the peace I never knew I was searching for,
the prayer my soul was making
long before I even knew your face.`

`When I look at you,
I don’t just see beauty…
I see my future, my strength, my home.
I see the one person
I would choose again and again
in every lifetime, in every world.`

`And if life ever becomes hard,
if tears ever fall from your eyes,
remember this truth that will never change:
there is a heart somewhere on this earth
that beats only to protect yours.`

`No distance, no time, no storm
could ever make me stop loving you,
because loving you is no longer a choice —
it is the air my soul breathes.`

`Forever is not enough for me,
because even after forever ends,
my heart would still whisper…`

`just you and me ❤️`

];

function generateLove(){
  const poem=poems[Math.floor(Math.random()*poems.length)];
  document.getElementById("poem").innerText=poem;
}

/* WHATSAPP */
function shareWhatsApp(){
  const text=document.getElementById("poem").innerText;
  window.open("https://wa.me/?text="+encodeURIComponent(text));
}

/* HEARTS */
function heart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=Math.random()*20+20+"px";
  h.style.animationDuration=Math.random()*3+3+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(heart,300);
</script>

</body>
</html>
