<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
body{
margin:0;
font-family:Georgia;
background:linear-gradient(135deg,#ff4d6d,#ff758c);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.container{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
width:420px;
z-index:2;
}

h1{color:#ff2e63;}

button{
background:#ff2e63;
color:white;
border:none;
padding:10px 18px;
margin:6px;
border-radius:10px;
cursor:pointer;
}

#poem{
margin-top:20px;
font-size:20px;
font-style:italic;
min-height:120px;
}

img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin:5px;
}

.heart{
position:absolute;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-100px);}
100%{transform:translateY(100vh);}
}
</style>
</head>

<body>

<div class="container" id="capture">

<h1>❤️ Makaya Makosso Mary Laure ❤️</h1>

<h3 id="timer"></h3>

<input type="file" id="photoUpload" multiple>
<br>

<div id="photos"></div>

<button onclick="generateLove()">Generate Love Message</button>
<button onclick="shareWhatsApp()">Share WhatsApp</button>

<div id="poem"></div>

</div>

<script>
const name="Makaya Makosso Mary Laure";

/* LOVE TIMER — set your date here */
const loveDate=new Date("2025-11-26");

function updateTimer(){
const now=new Date();
const diff=now-loveDate;
const days=Math.floor(diff/(1000*60*60*24));
document.getElementById("timer").innerText=
"❤️ Together for "+days+" days ❤️";
}
setInterval(updateTimer,1000);

/* PHOTO UPLOAD */
document.getElementById("photoUpload").addEventListener("change",function(e){
const container=document.getElementById("photos");
container.innerHTML="";
Array.from(e.target.files).forEach(file=>{
const reader=new FileReader();
reader.onload=function(event){
const img=document.createElement("img");
img.src=event.target.result;
container.appendChild(img);
}
reader.readAsDataURL(file);
});
});

/* POEMS */
const poems=[
`My dearest ${name},
You are my heartbeat, my soul’s light,
The star that brightens every night.`,

`${name}, my forever love,
You are my angel from above,
My heart belongs to you alone.`,

`With you ${name}, my world is bright,
You are my dream, my heart’s delight.`];

function generateLove(){
const poem=poems[Math.floor(Math.random()*poems.length)];
document.getElementById("poem").innerText=poem;
}

/* WHATSAPP */
function shareWhatsApp(){
const text=document.getElementById("poem").innerText;
window.open("https://wa.me/?text="+encodeURIComponent(text));
}

/* HEARTS */
function heart(){
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=Math.random()*20+20+"px";
h.style.animationDuration=Math.random()*3+3+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}
setInterval(heart,300);
</script>

</body>

</html>
